services:
  - type: web
    name: snake-game
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-db
          property: connectionString

databases:
  - name: snake-db
    plan: free
    databaseName: snake
    user: snake
