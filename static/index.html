<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>贪吃蛇 Snake Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🐍 贪吃蛇</h1>
      <p class="tip">点击画面上下左右控制方向 · 方向键同样可用 · 空格暂停</p>
    </header>

    <main class="main-grid">
      <section class="game-panel">

        <!-- ① 难度选择页 -->
        <div id="startScreen" class="screen start-screen">
          <h2 class="start-title">选择难度</h2>
          <button type="button" id="netStatus" class="net-status checking">检测连接中…</button>
          <div class="diff-buttons diff-buttons-lg" role="radiogroup">
            <button type="button" class="diff-btn" data-diff="easy">简单</button>
            <button type="button" class="diff-btn" data-diff="normal">普通</button>
            <button type="button" class="diff-btn" data-diff="hard">困难</button>
            <button type="button" class="diff-btn" data-diff="insane">疯狂</button>
            <button type="button" class="diff-btn" data-diff="dynamic">动态 ↑</button>
          </div>
          <p class="diff-hint" id="diffHint">固定速度 200ms，不自动加速</p>

          <div class="control-select">
            <div class="control-select-title">控制方式</div>
            <div class="control-buttons" role="radiogroup">
              <button type="button" class="ctrl-btn" data-control="dpad">✛ 方向键</button>
              <button type="button" class="ctrl-btn" data-control="joystick">🕹 摇杆</button>
              <button type="button" class="ctrl-btn" data-control="tap">👆 点按画面</button>
            </div>
          </div>

          <button id="startGameBtn" class="btn-primary btn-start-game">开始游戏</button>
          <p class="start-tip">支持方向键 / 摇杆 / 点按画面三种操作</p>
        </div>

        <!-- ② 游戏页 -->
        <div id="gameScreen" class="screen hidden">
          <div class="hud">
            <div class="score-box">
              <span class="label">当前分数</span>
              <span id="score" class="value">0</span>
            </div>
            <div class="score-box">
              <span class="label">最高纪录</span>
              <span id="highScore" class="value">0</span>
            </div>
            <div class="score-box">
              <span class="label">难度</span>
              <span id="difficultyLabel" class="value">普通</span>
            </div>
            <div class="score-box">
              <span class="label">状态</span>
              <span id="status" class="value">准备开始</span>
            </div>
          </div>

          <div class="canvas-wrap">
            <canvas id="game" width="400" height="400"></canvas>
            <div id="startHint" class="start-hint">
              <span class="start-hint-title" id="startHintTitle">轻触开始</span>
              <span class="start-hint-sub" id="startHintSub">点击画面上下左右控制方向</span>
            </div>
            <div id="overlay" class="overlay hidden">
              <div class="overlay-content">
                <h2 id="overlayTitle">游戏结束</h2>
                <p class="final-score-line">本次得分：<span id="finalScore">0</span></p>

                <div id="submitForm" class="submit-form">
                  <div class="nickname-row">
                    <input id="nicknameInput" type="text" placeholder="输入昵称（最多20字）" maxlength="20" />
                    <button type="button" id="clearNicknameBtn" class="clear-nickname-btn" title="清除已保存的昵称" hidden>✕</button>
                  </div>
                  <div class="submit-actions">
                    <button id="submitBtn" type="button">提交分数</button>
                  </div>
                  <p id="submitMsg" class="submit-msg"></p>
                  <label class="remember-nickname">
                    <input type="checkbox" id="rememberNickname" checked />
                    <span>记住昵称，下次自动填充</span>
                  </label>
                </div>

                <!-- 每局结束展示排行榜 -->
                <div class="overlay-board">
                  <div class="overlay-board-title">🏆 排行榜 Top 10</div>
                  <div class="board-note" id="boardNote" hidden></div>
                  <ol id="leaderboard" class="leaderboard">
                    <li class="empty">暂无记录，快来上榜吧！</li>
                  </ol>
                  <button id="refreshBtn" class="btn-ghost">刷新排行榜</button>
                </div>

                <div class="overlay-actions">
                  <button id="restartBtn" type="button" class="btn-primary">再来一局（R）</button>
                  <button id="changeDiffBtn" type="button" class="btn-secondary">换个难度</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 屏幕下方的方向控制区（方向键 / 摇杆，进入游戏前选择） -->
          <div class="pad-area" id="padArea">
            <div class="dpad hidden" id="dpad" aria-label="方向控制">
              <button type="button" class="dpad-btn dpad-up" data-dir="UP" aria-label="向上">▲</button>
              <button type="button" class="dpad-btn dpad-left" data-dir="LEFT" aria-label="向左">◀</button>
              <button type="button" class="dpad-btn dpad-center" id="dpadPause" aria-label="暂停 / 继续">❚❚</button>
              <button type="button" class="dpad-btn dpad-right" data-dir="RIGHT" aria-label="向右">▶</button>
              <button type="button" class="dpad-btn dpad-down" data-dir="DOWN" aria-label="向下">▼</button>
            </div>

            <div class="joystick hidden" id="joystick" aria-label="虚拟摇杆">
              <div class="joystick-base" id="joystickBase">
                <div class="joystick-knob" id="joystickKnob"></div>
              </div>
            </div>
          </div>

          <div class="controls">
            <button id="startBtn" class="btn-primary">开始游戏</button>
            <button id="pauseBtn" class="btn-secondary">暂停 / 继续</button>
          </div>
        </div>

      </section>
    </main>

    <button type="button" id="soundToggle" class="sound-toggle" title="音效开关" aria-label="音效开关">
      <span class="sound-icon" id="soundIcon">🔊</span>
    </button>
  </div>

  <script src="game.js"></script>
</body>
</html>
